<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Log in — Upwork Kenya</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14a800">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Upwork Kenya">
<meta name="description" content="Log in to Upwork Kenya — Kenya's freelance marketplace. Daily gigs, live wallet, M-Pesa withdrawals.">
<link rel="canonical" href="https://upworkkenya.co.ke/login.html">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"Upwork Kenya","url":"https://upworkkenya.co.ke/","logo":"https://upworkkenya.co.ke/icons/icon-512.png"}</script>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/install.css">
</head>
<body>
<div id="splash">
  <div class="splash-logo">Upwork<span>Kenya</span></div>
  <div class="splash-bar"><i></i></div>
</div>

<div class="auth-wrap">
  <div class="auth-hero">
    <div class="brand" style="color:#fff;font-size:24px">Upwork<span>Kenya</span> 🇰🇪</div>
    <h1>Welcome back. Your next gig is waiting.</h1>
    <p>Log in to see today's task drop, check your wallet and track your orders.</p>
    <div class="hero-badges">
      <span class="hero-badge">⚡ Daily tasks</span><span class="hero-badge">✔ Verified badges</span>
      <span class="hero-badge">📈 Tier upgrades</span>
    </div>
  </div>
  <div class="auth-card">
    <div class="auth-box">
      <h2>Log in</h2>
      <p class="sub">Enter your email and password.</p>
      <form id="loginForm">
        <label>Email address</label>
        <input id="email" type="email" required placeholder="you@example.com" autocomplete="email">
        <label>Password</label>
        <input id="password" type="password" required placeholder="Your password" autocomplete="current-password">
        <div style="margin-top:22px"><button class="btn btn-primary" type="submit" id="loginBtn">Log in →</button></div>
        <div class="form-msg" id="msg"></div>
      </form>
      <div class="auth-links">
        <a href="forgot.html">Forgot password?</a>
        <a href="register.html"><b>Create account</b></a>
      </div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
/* Cache self-heal: force the newest service worker once per version so a stale
   cached shell can never break requests again (fixes "Request failed" on login
   in Chrome without needing incognito). Reload is guarded — it can happen at
   most once per tab, so there is no reload loop. */
(function(){try{
  var K='uk_sw_ver',V='2.2.0';
  if(!('serviceWorker' in navigator))return;
  navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.update().catch(function(){});});}).catch(function(){});
  if(localStorage.getItem(K)!==V){
    localStorage.setItem(K,V);
    if(navigator.serviceWorker.controller){
      try{navigator.serviceWorker.controller.postMessage({type:'SKIP_WAITING'});}catch(e){}
      if(sessionStorage.getItem('uk_sw_reloaded')!=='1'){sessionStorage.setItem('uk_sw_reloaded','1');setTimeout(function(){location.reload();},400);}
    }
  }
}catch(e){}})();
</script>
<script>
UK.splash(700);
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('msg'), btn = document.getElementById('loginBtn');
  msg.className = 'form-msg'; btn.disabled = true; btn.textContent = 'Logging in…';
  try {
    const r = await UK.api('/api/login', { method: 'POST', body: JSON.stringify({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    })});
    UK.token = r.token; UK.user = r.user;
    msg.className = 'form-msg ok'; msg.textContent = 'Karibu back! Opening your dashboard…';
    setTimeout(() => location.href = 'app.html', 700);
  } catch (err) {
    msg.className = 'form-msg err'; msg.textContent = err.message;
    btn.disabled = false; btn.textContent = 'Log in →';
  }
});
</script>
<script src="js/install.js"></script>
</body>
</html>
