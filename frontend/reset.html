<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>New password — Upwork Kenya</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14a800">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Upwork Kenya">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/install.css">
</head>
<body>
<div id="splash">
  <div class="splash-logo">Upwork<span>Kenya</span></div>
  <div class="splash-bar"><i></i></div>
</div>

<div class="auth-card" style="min-height:100vh">
  <div class="auth-box">
    <h2>Choose a new password</h2>
    <p class="sub">Make it at least 6 characters.</p>
    <form id="rForm">
      <label>New password</label>
      <input id="p1" type="password" required minlength="6" placeholder="New password">
      <label>Confirm password</label>
      <input id="p2" type="password" required minlength="6" placeholder="Repeat it">
      <div style="margin-top:22px"><button class="btn btn-primary" type="submit" id="rBtn">Update password →</button></div>
      <div class="form-msg" id="msg"></div>
    </form>
    <div class="auth-links"><a href="login.html">← Back to login</a></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
/* Cache self-heal: force the newest service worker once per version so a stale
   cached shell can never break requests again (fixes "Request failed" on login
   in Chrome without needing incognito). Reload is guarded — it can happen at
   most once per tab, so there is no reload loop. */
(function(){try{
  var K='uk_sw_ver',V='2.2.0';
  if(!('serviceWorker' in navigator))return;
  navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.update().catch(function(){});});}).catch(function(){});
  if(localStorage.getItem(K)!==V){
    localStorage.setItem(K,V);
    if(navigator.serviceWorker.controller){
      try{navigator.serviceWorker.controller.postMessage({type:'SKIP_WAITING'});}catch(e){}
      if(sessionStorage.getItem('uk_sw_reloaded')!=='1'){sessionStorage.setItem('uk_sw_reloaded','1');setTimeout(function(){location.reload();},400);}
    }
  }
}catch(e){}})();
</script>
<script>
UK.splash(700);
const token = new URLSearchParams(location.search).get('token') || '';
if (!token) { document.getElementById('msg').className = 'form-msg err'; document.getElementById('msg').textContent = 'This reset link is missing its token. Request a new one.'; }
document.getElementById('rForm').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('msg'), btn = document.getElementById('rBtn');
  const p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
  if (p1 !== p2) { msg.className = 'form-msg err'; msg.textContent = 'Passwords do not match.'; return; }
  btn.disabled = true; btn.textContent = 'Updating…';
  try {
    await UK.api('/api/reset-password', { method: 'POST', body: JSON.stringify({ token, password: p1 })});
    msg.className = 'form-msg ok'; msg.textContent = 'Password updated! Redirecting to login…';
    setTimeout(() => location.href = 'login.html', 1100);
  } catch (err) {
    msg.className = 'form-msg err'; msg.textContent = err.message;
    btn.disabled = false; btn.textContent = 'Update password →';
  }
});
</script>
<script src="js/install.js"></script>
</body>
</html>
